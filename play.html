<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сабаққа қосылу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--s2:#e8eef8;--ink:#0d1a2d;--mute:#4a5a72;--line:#cbd5e4;--air:#0a6f84;--air-bg:#dcf1f5;--wire:#9a5a08;--bad:#b42318;--bad-bg:#fde9e8;--ok:#1b7a43;--ok-bg:#e1f3e8;--on:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#08101e;--surface:#111c31;--s2:#18273f;--ink:#e8eef9;--mute:#aebcd2;--line:#2a3b5a;--air:#39c3dc;--air-bg:#0e2d38;--wire:#f0b960;--bad:#ff8a80;--bad-bg:#3a1b20;--ok:#62d68f;--ok-bg:#12301f;--on:#06121b}}
:root[data-theme="dark"]{--bg:#08101e;--surface:#111c31;--s2:#18273f;--ink:#e8eef9;--mute:#aebcd2;--line:#2a3b5a;--air:#39c3dc;--air-bg:#0e2d38;--wire:#f0b960;--bad:#ff8a80;--bad-bg:#3a1b20;--ok:#62d68f;--ok-bg:#12301f;--on:#06121b}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 "Noto Sans","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1,h2{font-family:"Noto Serif",Georgia,serif;margin:0 0 12px;line-height:1.2}
h1{font-size:28px}h2{font-size:24px}
p{margin:0 0 12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--mute);font-size:15px}
.top b{color:var(--ink)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
input,textarea{font:inherit;width:100%;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
input[type=number]{font-size:22px;font-weight:700}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:600;font-size:15px;color:var(--mute);margin-bottom:4px}
.btn{font:700 19px "Noto Sans",sans-serif;width:100%;cursor:pointer;background:var(--air);color:var(--on);border:0;border-radius:14px;padding:16px 20px}
.btn:disabled{opacity:.45}
.opt{font:600 20px "Noto Sans",sans-serif;display:flex;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer;background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.opt i{font:700 24px "Noto Serif",serif;font-style:normal;color:var(--air);min-width:28px}
.opt.on{border-color:var(--air);background:var(--air-bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sc button{font:700 24px "Noto Sans",sans-serif;padding:18px 0;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.sc button.on{border-color:var(--air);background:var(--air-bg)}
.msg{border-radius:16px;padding:18px 20px;font-size:19px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.no{background:var(--bad-bg);color:var(--bad)}.msg.in{background:var(--air-bg);color:var(--ink)}
.big{font:700 44px "Noto Serif",serif;text-align:center;margin:10px 0}
.mute{color:var(--mute);font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.off{background:var(--bad)}
.err{color:var(--bad);font-weight:600;margin:8px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* Firebase Realtime Database URL, мысалы: https://жоба-default-rtdb.firebaseio.com  (бос қалдырсаңыз, ?db=... параметрі қолданылады) */
var FB_URL='https://kl-ca17a-default-rtdb.europe-west1.firebasedatabase.app/';
(function(){
var Q=new URLSearchParams(location.search),DB=(Q.get('db')||FB_URL||'').replace(/\/$/,''),app=document.getElementById('app'),L=['A','B','C','D'];
var S={code:(Q.get('r')||'').trim(),nick:'',pid:'',cur:null,seen:0,sent:{},sc:null,ended:false,joined:false,err:'',bad:0,sig:'',busy:false};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(p,m,b){var o={};if(m){o.method=m;o.body=JSON.stringify(b);}return fetch(DB+'/'+p+'.json',o).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function head(){return '<div class="top"><span class="dot'+(S.bad>2?' off':'')+'"></span><b>'+esc(S.nick||'Сабаққа қосылу')+'</b><span style="flex:1"></span>'+(S.sc?'<span>Ұпай: <b>'+S.sc.s+'</b>'+(S.sc.r?' · '+S.sc.r+'-орын':'')+'</span>':'')+'</div>';}
function R(h){app.innerHTML=h;}
function joinView(){R('<h1>Сабаққа қосылу</h1><p class="mute">Жүргізуші көрсеткен кодты енгізіп, есіміңізді жазыңыз.</p><label for="c">Код</label><input id="c" inputmode="numeric" maxlength="6" value="'+esc(S.code)+'" autocomplete="off"><label for="n">Есіміңіз немесе бүркеншік атыңыз</label><input id="n" maxlength="16" autocomplete="off"><p class="mute">Тек есім немесе бүркеншік ат жазыңыз, басқа жеке дерек енгізбеңіз. Деректер сабақ аяқталған соң жойылады.</p>'+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'<button class="btn" id="go"'+(DB?'':' disabled')+'>Қосылу</button>'+(DB?'':'<p class="err">Дерекқор бапталмаған (FB_URL).</p>'));
 document.getElementById('go').onclick=join;document.getElementById('n').addEventListener('keydown',function(e){if(e.key==='Enter')join();});}
function join(){var c=document.getElementById('c').value.trim(),n=document.getElementById('n').value.trim().slice(0,16);if(!/^\d{3,6}$/.test(c)){S.err='Кодты тексеріңіз.';S.code=c;return joinView();}if(!n){S.err='Есіміңізді жазыңыз.';S.code=c;return joinView();}
 S.code=c;api('rooms/'+c+'/live').then(function(l){if(!l){S.err='Бөлме табылмады. Кодты тексеріңіз.';return joinView();}
  return api('rooms/'+c+'/players').then(function(P){var names=P?Object.keys(P).map(function(k){return P[k].n;}):[],nn=n,i=2;while(names.indexOf(nn)>-1)nn=n+'·'+(i++);S.nick=nn;S.pid=Math.random().toString(36).slice(2,9);
   return api('rooms/'+c+'/players/'+S.pid,'PUT',{n:nn,j:Date.now()}).then(function(){S.joined=true;S.err='';render(true);poll();});});}).catch(function(){S.err='Байланыс қатесі. Қайталап көріңіз.';joinView();});}
function submit(v){var cur=S.cur;if(!cur||S.sent[cur.id]!=null)return;var d=Date.now()-S.seen;S.sent[cur.id]=v;render(true);api('rooms/'+S.code+'/ans/'+cur.id+'/'+S.pid,'PUT',{v:v,d:d}).catch(function(){delete S.sent[cur.id];S.err='Жауап жіберілмеді, қайта басыңыз.';render(true);});}
function render(force){var cur=S.cur,sg=[S.joined,S.ended,cur&&cur.id,cur&&cur.st,cur&&S.sent[cur.id]!=null,S.sc&&S.sc.s,S.sc&&S.sc.r,S.bad>2,S.err].join('|');if(!force&&sg===S.sig)return;S.sig=sg;
 if(S.ended){return R(head()+'<h2>Сабақ аяқталды</h2><div class="msg in">Қатысқаның үшін рақмет!'+(S.sc?'<div class="big">'+S.sc.s+' ұпай</div>'+(S.sc.r?'<p style="text-align:center">'+S.sc.r+'-орын</p>':''):'')+'</div>');}
 if(!cur)return R(head()+'<h2>Күтіңіз...</h2><div class="msg in">Сіз қосылдыңыз. Жүргізуші сұрақты жібергенше күтіңіз. Назарыңыз экранда болсын.</div>');
 var sent=S.sent[cur.id],h=head()+'<h2>'+esc(cur.q)+'</h2>',rev=cur.st==='reveal',lock=sent!=null||cur.st!=='open';
 if(cur.type==='choice'){(cur.o||[]).forEach(function(o,k){var cls='opt';if(rev&&cur.c!=null){if([].concat(cur.c).indexOf(k)>-1)cls+=' ok';else if(sent===k)cls+=' no';}else if(sent===k)cls+=' on';h+='<button class="'+cls+'" data-k="'+k+'" '+(lock?'disabled':'')+'><i>'+L[k]+'</i>'+esc(o)+'</button>';});}
 else if(cur.type==='nums'){(cur.f||[]).forEach(function(f,k){h+='<label for="f'+k+'">'+esc(f)+'</label><input id="f'+k+'" type="number" min="0" inputmode="numeric" '+(lock?'disabled value="'+esc(sent&&sent[k])+'"':'')+'>';});if(!lock)h+='<button class="btn" id="sn">Жіберу</button>';}
 else if(cur.type==='scale'){h+='<div class="sc">'+[1,2,3,4,5].map(function(n){return '<button data-k="'+n+'" class="'+(sent===n?'on':'')+'" '+(lock?'disabled':'')+'>'+n+'</button>';}).join('')+'</div><p class="mute" style="margin-top:8px">'+esc(cur.lab||'1: мүлде түсінбедім, 5: толық түсіндім')+'</p>';}
 else if(cur.type==='text'){h+=lock?'<div class="card">'+esc(sent)+'</div>':'<textarea id="tx" maxlength="140" placeholder="Жауабыңды жаз..."></textarea><button class="btn" id="st">Жіберу</button>';}
 if(S.err)h+='<p class="err">'+esc(S.err)+'</p>';
 if(sent!=null&&!rev)h+='<div class="msg in" style="margin-top:6px">Жауап қабылданды. Нәтижені күтіңіз.</div>';
 if(sent==null&&cur.st!=='open')h+='<div class="msg no" style="margin-top:6px">Жауап қабылдау жабылды.</div>';
 if(rev&&cur.type==='choice'&&cur.c!=null){var cc=[].concat(cur.c),ok=cc.indexOf(sent)>-1,d=S.sc&&S.sc.d;h+='<div class="msg '+(ok?'ok':'no')+'" style="margin-top:6px"><b>'+(sent==null?'Жауап берілмеді.':ok?'Дұрыс!'+(d?' +'+d+' ұпай':''):'Қате.')+'</b>'+(ok?'':'<br>Дұрыс жауап: '+cc.map(function(k){return L[k]+'. '+esc((cur.o||[])[k]);}).join(' немесе '))+(cur.w?'<br><span class="mute" style="color:inherit">'+esc(cur.w)+'</span>':'')+'</div>';}
 else if(rev&&sent!=null)h+='<div class="msg ok" style="margin-top:6px">Рақмет! Жауабың есепке алынды.</div>';
 R(h);
 $$('.opt,.sc button').forEach(function(b){b.onclick=function(){submit(+b.dataset.k);};});
 var sn=document.getElementById('sn');if(sn)sn.onclick=function(){var v=(cur.f||[]).map(function(_,k){return +document.getElementById('f'+k).value||0;});submit(v);};
 var st=document.getElementById('st');if(st)st.onclick=function(){var v=document.getElementById('tx').value.trim().slice(0,140);if(v)submit(v);};}
function $$(s){return [].slice.call(document.querySelectorAll(s));}
function poll(){if(S.ended)return;Promise.all([api('rooms/'+S.code+'/live'),api('rooms/'+S.code+'/sc/'+S.pid)]).then(function(r){S.bad=0;var l=r[0];if(!l){S.ended=true;return render(true);}
  var c=l.cur||null;if(c&&(!S.cur||S.cur.id!==c.id)){S.seen=Date.now();S.err='';}if(!c)S.cur=null;else S.cur=c;S.sc=r[1];render(false);}).catch(function(){S.bad++;render(false);}).then(function(){setTimeout(poll,1200);});}
S.code?joinView():joinView();
})();
</script>
</body>
</html>
